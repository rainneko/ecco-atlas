{% extends "base.html" %}
{% block title %}Admin · {{ cfg.SITE_TITLE }}{% endblock %}
{% block body %}
<h1>Admin</h1>
<p class="note">Your name is recorded with every change you make.</p>
{% if err %}<p class="flash err">{{ err }}</p>{% endif %}
<form method="post" action="/admin/login" class="controls">
  <label>Name <input name="name" value="{{ name }}" autocomplete="username" required autofocus></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button>Log in</button>
</form>
{% endblock %}
